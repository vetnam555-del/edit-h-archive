# EDIT H 매일 성과 수집 — 인스타(좋아요·댓글, 권한이 있으면 도달·저장·공유), 메일(답장·구독 신청·수신 거부), 발송 대상 수, 투표.
# 매일 21:30(KST). automation/metrics/summary.md 를 22:00 편집 회고와 다음 날 07:00 제작 루틴이 읽는다(automation/learnings.md).
# GitHub 예약 실행은 자주 늦거나 빠져서, 회고가 성과표가 오래됐으면 request.txt 를 푸시해 여기를 바로 돌린다(automation/request_metrics.py).
# 공개 저장소라 숫자만 남기고 로그에도 주소·계정 이름은 찍지 않는다.
name: Collect EDIT H metrics

on:
  schedule:
    # GitHub 예약은 2~3시간 늦게 돌기 일쑤라(9/25~10/3 매일 다음 날 새벽에야 수집) 일찍 걸고 21:30 까지 기다린다.
    # 먼저 21:00 뒤에 모은 실행이 있으면 나머지는 건너뛴다(--skip-if-fresh).
    - cron: "13 9 * * *"     # KST 18:13 → 21:30 까지 대기
    - cron: "43 10 * * *"    # KST 19:43 → 21:30 까지 대기(앞 실행이 빠졌을 때)
    - cron: "30 12 * * *"    # UTC 12:30 = KST 21:30 매일
  push:
    branches: [main]
    paths: ["automation/metrics/request.txt"]   # 22:00 편집 회고의 수집 요청(예약 실행이 늦을 때)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "모으기만 하고 저장하지 않음"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 18:13 예약이 21:30 까지 기다릴 수 있게
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait until 21:30 KST
        if: github.event_name == 'schedule'
        run: python3 automation/wait_until_send.py schedule --at 21:30

      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          IN_DRY: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          git pull --ff-only origin main || true   # 기다리는 동안 다른 실행이 모았을 수 있다
          if [ "$IN_DRY" = "true" ]; then python3 automation/collect_metrics.py --dry-run
          elif [ "$EVENT" = "schedule" ]; then python3 automation/collect_metrics.py --skip-if-fresh
          else python3 automation/collect_metrics.py; fi

      - name: Record metrics
        run: |
          if [ -n "$(git status --porcelain automation/metrics)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/metrics
            git commit -m "Collect EDIT H metrics ($(date -u +%F))"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
