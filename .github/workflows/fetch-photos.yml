# 표지 후보 사진 받기 — assets/photos/incoming.json 에 주소를 더하면 GitHub 서버가 받아 assets/photos/{name}.jpg 로 넣는다
# (automation/fetch_incoming_photos.py). Claude 작업 환경은 이미지 서버 접속이 막혀 있어 음악 받기(fetch-music.yml)와 같은 방식.
# 받은 사진은 표지 후보가 아니다 — 개선 루틴이 눈으로 검수해 assets/photos/library.json 에 올린 뒤부터 쓰인다.
# 개선 브랜치(claude/…)에 목록을 올리면 그 브랜치에 받아 넣어, PR 안에서 사진을 검수할 수 있다.
name: Fetch cover photos

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["assets/photos/incoming.json"]

permissions:
  contents: write

concurrency:
  group: fetch-photos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Pillow
        run: pip install -q pillow

      - name: Fetch
        run: python3 automation/fetch_incoming_photos.py

      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain assets/photos assets/mascot)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/photos assets/mascot
            git commit -m "Add fetched cover photo candidates"
            for i in 1 2 3 4; do
              git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
              sleep $((i * 5))
            done
          fi
