# EDIT H 뉴스레터 발송.
# 콘텐츠는 매 영업일 08:00(KST)에 Claude 클라우드 루틴이 만들어 main 에 푸시하고,
# 발송은 여기서 09:00(KST)에 한다. 예약은 08:40 에 걸고 wait_until_send.py 가 09:00 까지 기다린다
# (GitHub 예약 실행은 정각에 몰려 늦게 시작되기 쉬워서). 루틴이 늦어 09:00 이후에 푸시되면 push 트리거가 바로 보낸다.
# 필요한 Secrets: SMTP_USER, SMTP_PASSWORD, SUBSCRIBERS (자세한 건 automation/README.md)
name: Send EDIT H newsletter

on:
  schedule:
    - cron: "40 23 * * 0-4"   # UTC 일–목 23:40 = KST 월–금 08:40 → 09:00 까지 대기 후 발송
  push:
    branches: [main]
    paths: ["20[0-9][0-9]-[0-9][0-9]-[0-9][0-9].html"]
  workflow_dispatch:
    inputs:
      date:
        description: "보낼 호 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
      test_to:
        description: "테스트 수신 주소 — 입력하면 이 주소로만 보내고 발송 기록은 남기지 않음"
        required: false

permissions:
  contents: write

concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기 중 다른 실행이 남긴 발송 기록까지 보도록 최신 main 을 받는다

      - name: Wait until send time (KST)
        env:
          EVENT: ${{ github.event_name }}
        run: python3 automation/wait_until_send.py "$EVENT"

      - name: Refresh main
        # 기다리는 동안 올라온 호·다른 실행이 남긴 발송 기록을 반영
        run: git pull --ff-only origin main

      - name: Send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          EVENT: ${{ github.event_name }}
          IN_DATE: ${{ inputs.date }}
          IN_TEST_TO: ${{ inputs.test_to }}
        run: python3 automation/send_newsletter.py --mode "$EVENT" --date "$IN_DATE" --test-to "$IN_TEST_TO"

      - name: Record send
        run: |
          if [ -n "$(git status --porcelain automation/sent)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/sent
            git commit -m "Record newsletter send ($(ls -t automation/sent | head -1 | sed 's/.json//'))"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
