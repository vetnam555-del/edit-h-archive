# EDIT H 인스타그램 자동 게시 — 카드 캐러셀 + 음악 릴스.
# 데일리: 매 영업일 08:00(KST, 뉴스레터와 같은 시각 = config.send_time_kst). 금요일 주간 특집(TOP5): 18:00.
# 카드는 07:00 Claude 루틴이 만들어 main 에 푸시하고(instagram/{날짜}/ig/*.jpg 포함), 여기서는 게시만 한다.
# 발행하지 않은 날(주말·공휴일)은 폴더가 없어 그냥 끝난다. 같은 호는 automation/ig_posted/ 기록으로 두 번 올리지 않는다.
# 필요한 Secrets: IG_ACCESS_TOKEN(필수) · IG_APP_SECRET · GH_ADMIN_TOKEN(권장, 토큰 자동 교환·연장) — automation/README.md '인스타그램 자동 게시'
name: Post EDIT H to Instagram

on:
  schedule:
    - cron: "30 22 * * 0-4"   # KST 월–금 07:30 → 08:00 까지 대기 후 데일리 게시
    - cron: "5 23 * * 0-4"    # KST 08:05 예비 실행(이미 올렸으면 건너뜀)
    - cron: "40 8 * * 5"      # KST 금 17:40 → 18:00 까지 대기 후 주간 특집 게시
  push:
    branches: [main]
    paths: ["20[0-9][0-9]-[0-9][0-9]-[0-9][0-9].html"]   # 루틴이 08:00 이후에 늦게 푸시한 날(그 전 push 는 예약 게시에 맡긴다)
  workflow_dispatch:
    inputs:
      key:
        description: "게시할 호 — YYYY-MM-DD 또는 YYYY-MM-DD-weekly (비우면 오늘 데일리)"
        required: false
      mode:
        description: "check = 토큰 확인만 · dry-run = 게시 없이 이미지·영상·컨테이너까지 확인 · post = 실제 게시"
        type: choice
        options: [check, dry-run, post]
        default: check
      only:
        description: "하나만 게시(선택)"
        type: choice
        options: [both, carousel, reel]
        default: both

permissions:
  contents: write

concurrency:
  group: post-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 370   # 새벽에 올린 오늘 호를 08:00 까지 기다려 보낼 수 있게(wait_until_send.MAX_WAIT)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide what to post
        id: what
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = "40 8 * * 5" ]; then
            echo "kind=weekly" >> "$GITHUB_OUTPUT"; echo "at=18:00" >> "$GITHUB_OUTPUT"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"; echo "at=" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until post time (KST)
        env:
          EVENT: ${{ github.event_name }}
          AT: ${{ steps.what.outputs.at }}
        run: |
          if [ -n "$AT" ]; then python3 automation/wait_until_send.py "$EVENT" --at "$AT"
          else python3 automation/wait_until_send.py "$EVENT" --need "instagram/{date}/caption.txt"; fi

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Install ffmpeg and PyNaCl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pynacl

      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          KIND: ${{ steps.what.outputs.kind }}
          EVENT: ${{ github.event_name }}
          IN_KEY: ${{ inputs.key }}
          IN_MODE: ${{ inputs.mode }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          args="--kind $KIND --event $EVENT"
          [ -n "$IN_KEY" ] && args="$args --key $IN_KEY"
          [ "$IN_MODE" = "check" ] && args="$args --check"
          [ "$IN_MODE" = "dry-run" ] && args="$args --dry-run"
          [ -n "$IN_ONLY" ] && [ "$IN_ONLY" != "both" ] && args="$args --only $IN_ONLY"
          python3 automation/post_instagram.py $args

      - name: Record post
        if: always()
        run: |
          if [ -n "$(git status --porcelain automation/ig_posted instagram)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/ig_posted instagram
            git commit -m "Record Instagram post ($(date -u +%F))"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
