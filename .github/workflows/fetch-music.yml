# 릴스 배경음악 받기 — assets/music/tracks.json 에 곡을 추가한 뒤 한 번 실행한다(Actions → Fetch reel music → Run workflow).
# 위키미디어가 클라우드 공용 IP 의 원본 파일 요청을 막는 경우가 있어 GitHub 서버에서 받는다.
name: Fetch reel music

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/music/tracks.json"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Fetch
        run: python3 automation/fetch_music.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain assets/music)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/music
            git commit -m "Add reel music clips"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
