# EDIT H 운영 알림 — 문제가 생기면 운영자 메일(SMTP_USER)로 바로 알린다(automation/alert.py).
# 1) 발송·게시·구독 반영·집계 워크플로가 실패로 끝나면 곧바로(workflow_run 은 예약 실행과 달리 늦지 않는다).
# 2) 발행 감시: 매일 08:40·09:40(KST) 오늘 호·메일 발송·인스타 게시·웹 페이지·성과 수집·인스타 토큰을 확인한다.
#    제작 루틴이 원고를 못 올린 날은 다른 워크플로가 '실패'하지 않고 조용히 끝나서 이걸로만 잡힌다.
#    같은 날 같은 알림은 한 번만(automation/alerts/{날짜}.json 에 종류만 기록 — 주소·토큰은 남기지 않는다).
# 필요한 Secrets: SMTP_USER · SMTP_PASSWORD (발송과 같은 값)
name: EDIT H alerts

on:
  workflow_run:
    workflows:
      - Send EDIT H newsletter
      - Post EDIT H to Instagram
      - Sync EDIT H subscribers
      - Tally EDIT H poll
      - Collect EDIT H metrics
      - Fetch reel music
      - EDIT H reserve issue
    types: [completed]
  schedule:
    - cron: "40 23 * * *"    # UTC 23:40 = KST 08:40 매일
    - cron: "40 0 * * *"     # KST 09:40 — 08:40 실행이 밀리거나 빠졌을 때(같은 알림은 다시 안 보냄)
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = 오늘 발행 흐름 점검 · test = 알림 메일 시험 한 통"
        type: choice
        options: [watch, test]
        default: watch
      date:
        description: "watch 로 볼 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  failed:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Alert
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: python3 automation/alert.py failed

  watch:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: alerts-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Watch
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GITHUB_TOKEN: ${{ github.token }}   # 아직 돌고 있는 발송·게시가 있으면 그 항목은 다음 점검으로 미룬다
          IN_MODE: ${{ inputs.mode }}
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ "$IN_MODE" = "test" ]; then python3 automation/alert.py test
          else python3 automation/alert.py watch --date "$IN_DATE"; fi

      - name: Record alerts
        run: |
          if [ -n "$(git status --porcelain automation/alerts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/alerts
            git commit -m "Record EDIT H alert ($(date -u +%F))"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
