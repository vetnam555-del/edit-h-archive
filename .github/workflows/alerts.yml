# EDIT H 운영 알림 — 문제가 생기면 운영자 메일(SMTP_USER)로 바로 알린다(automation/alert.py).
# 1) 발송·게시·구독 반영·집계 워크플로가 실패로 끝나면 곧바로(workflow_run 은 예약 실행과 달리 늦지 않는다).
#    GitHub 서버(러너)를 못 잡아 시작도 못 한 실패는 할 일이 이미 끝났으면 조용히, 아니면 한 번 다시 돌려 결과를 기다리고 그것도 실패하면 알린다.
# 2) 발행 감시: 매일 08:40·09:40(KST) 오늘 호·메일 발송·인스타 게시·웹 페이지·성과 수집·인스타 토큰을 확인한다.
#    제작 루틴이 원고를 못 올린 날은 다른 워크플로가 '실패'하지 않고 조용히 끝나서 이걸로만 잡힌다.
#    같은 날 같은 알림은 한 번만(automation/alerts/{날짜}.json 에 종류만 기록 — 주소·토큰은 남기지 않는다).
# 필요한 Secrets: SMTP_USER · SMTP_PASSWORD (발송과 같은 값)
name: EDIT H alerts

on:
  workflow_run:
    workflows:
      - Send EDIT H newsletter
      - Post EDIT H to Instagram
      - Sync EDIT H subscribers
      - Tally EDIT H poll
      - Collect EDIT H metrics
      - Fetch reel music
      - Post EDIT H to Threads
      - EDIT H reserve issue
      - EDIT H evening chain
    types: [completed]
  schedule:
    # GitHub 예약은 2~4시간 늦는다(10/4: 08:40 점검이 11:50, 22:25 점검이 02:26 에 돌았다) — 지연 폭보다 앞서 두 번씩 걸고
    # 점검 시각까지 기다린다(wait 작업 — 점검 동시 실행 묶음 밖이라 수동 점검을 막지 않는다).
    - cron: "43 18 * * *"    # KST 03:43 → 08:40 까지 대기
    - cron: "13 20 * * *"    # KST 05:13 → 08:40 까지 대기(앞 예약이 빠졌을 때)
    # 저녁 점검(릴스 확인)은 저녁 일정 사슬(evening.yml)이 20:45 에 workflow_dispatch 로 돌린다 — 아래 저녁 예약 둘과 22:25 는 예비(4~6시간 늦다).
    - cron: "43 8 * * *"     # KST 17:43 → 22:25 까지 대기
    - cron: "13 10 * * *"    # KST 19:13 → 22:25 까지 대기
    - cron: "40 23 * * *"    # UTC 23:40 = KST 08:40 매일
    - cron: "40 0 * * *"     # KST 09:40 — 08:40 실행이 밀리거나 빠졌을 때(같은 알림은 다시 안 보냄)
    - cron: "25 13 * * *"    # KST 22:25 — 릴스를 저녁(19:30)에 올리는 날의 릴스 확인(아침 점검은 릴스를 건너뛴다)
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = 오늘 발행 흐름 점검 · test = 알림 메일 시험 한 통"
        type: choice
        options: [watch, test]
        default: watch
      date:
        description: "watch 로 볼 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  failed:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # 러너를 못 잡은 실행을 다시 돌리면 그 결과를 최대 40분 기다린다(alert.RERUN_WAIT_MIN)
    permissions:
      contents: read
      actions: write   # GitHub 서버(러너)를 못 잡아 시작도 못 한 실행을 한 번 다시 돌린다(alert.never_started)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Alert
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_TRIGGERED_BY: ${{ github.event.workflow_run.triggering_actor.login }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: python3 automation/alert.py failed

  # 일찍 건 예약은 여기서 점검 시각까지 기다린다. 동시 실행 묶음(alerts-watch) 밖이라 기다리는 동안에도 수동 점검·시험 메일은 바로 돈다.
  wait:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 330   # 03:43 예약이 08:40 까지(297분) 기다릴 수 있게
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: automation

      - name: Wait until the check time
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          case "$CRON" in
            "43 18 * * *"|"13 20 * * *") python3 automation/wait_until_send.py schedule --at 08:40 ;;
            "43 8 * * *"|"13 10 * * *") python3 automation/wait_until_send.py schedule --at 22:25 ;;
            *) echo "${CRON:-수동 실행}: 기다리지 않음" ;;
          esac

  watch:
    needs: wait
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: alerts-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4   # 기다린 뒤에 받으므로 그사이 올라온 발송·게시 기록이 들어 있다
        with:
          ref: main

      - name: Watch
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GITHUB_TOKEN: ${{ github.token }}   # 아직 돌고 있는 발송·게시가 있으면 그 항목은 다음 점검으로 미룬다
          IN_MODE: ${{ inputs.mode }}
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ "$IN_MODE" = "test" ]; then python3 automation/alert.py test
          else python3 automation/alert.py watch --date "$IN_DATE"; fi

      - name: Record alerts
        run: |
          if [ -n "$(git status --porcelain automation/alerts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/alerts
            git commit -m "Record EDIT H alert ($(date -u +%F))"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
